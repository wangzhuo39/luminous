[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luminous"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["tqdm>=4.66"]

[project.scripts]
luminous-api = "luminous.runtime.infrastructure.http:main"
luminous-worker = "luminous.runtime.worker:main"
luminous-backup = "luminous.runtime.infrastructure.backup:main"
luminous-training = "luminous.training.pipeline.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["luminous*"]
