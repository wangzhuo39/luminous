      <stop offset="100%" stop-color="#0f1926" />
    </linearGradient>
    <linearGradient id="light-beam" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="40%" stop-color="#eaf3ff" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#eaf3ff" stop-opacity="0.85" />
