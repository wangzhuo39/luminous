# LLaMA-Factory sanity SFT config for Ye Zheng HER messages.
# Replace model_name_or_path and dataset_dir with server-local absolute paths.

### model
model_name_or_path: /path/to/Qwen3-7B
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all

### dataset
dataset_dir: /path/to/yezhen_llamafactory_data
dataset: yezhen_her_train
template: qwen3
cutoff_len: 4096
max_samples: 256
overwrite_cache: true
preprocessing_num_workers: 8

### output
output_dir: /path/to/outputs/qwen3_7b_yezhen_her_sanity_lora
logging_steps: 1
save_steps: 50
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000

### eval
val_size: 0.05
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 25
