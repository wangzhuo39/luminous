# LLaMA-Factory full SFT config for Ye Zheng HER messages.
# Replace model_name_or_path and dataset_dir with server-local absolute paths.

### model
model_name_or_path: /path/to/Qwen3-7B
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all

### dataset
dataset_dir: /path/to/yezhen_llamafactory_data
dataset: yezhen_her_train
eval_dataset: yezhen_her_valid
template: qwen3
cutoff_len: 4096
overwrite_cache: true
preprocessing_num_workers: 8

### output
output_dir: /path/to/outputs/qwen3_7b_yezhen_her_lora
logging_steps: 10
save_steps: 200
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 1.0e-4
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
ddp_timeout: 180000000

### eval
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 200
